name: iOS Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to manually trigger the build from GitHub

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Configure iOS and Patch Podfile for ML Kit
        run: |
          flutter build ios --config-only
          cd ios
          # The google_mlkit_text_recognition package requires iOS 15.5 minimum
          sed -i '' "s/^# platform :ios, .*/platform :ios, '15.5'/" Podfile
          sed -i '' "s/^platform :ios, .*/platform :ios, '15.5'/" Podfile
          
          # Append the specific MLKit required build settings to the Podfile
          cat << 'EOF' >> Podfile
          
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.5'
                config.build_settings['EXCLUDED_ARCHS[sdk=iphonesimulator*]'] = 'armv7'
              end
            end
          end
          EOF

      - name: Build unsigned iOS app
        # --no-codesign is crucial because we don't have Apple Developer certificates loaded in this runner
        run: flutter build ios --release --no-codesign

      - name: Create IPA for sideloading
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuline_ocr_ios_build
          path: app.ipa
