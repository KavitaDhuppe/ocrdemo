name: iOS Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to manually trigger the build from GitHub

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Configure iOS and Patch Podfile for ML Kit
        run: |
          # The config step will fail during 'pod install' because Flutter generates a Podfile for iOS 15.0, 
          # but ML Kit requires 15.5. We use '|| true' to let the script continue so we can fix the Podfile.
          flutter build ios --config-only --no-codesign || true
          
          cd ios
          # The google_mlkit_text_recognition package requires iOS 15.5 minimum
          sed -i '' "s/^# platform :ios, .*/platform :ios, '15.5'/" Podfile
          sed -i '' "s/^platform :ios, .*/platform :ios, '15.5'/" Podfile
          
          # The flutter default Podfile already has a post_install block.
          # We will use sed to inject our build settings inside it.
          sed -i '' "s/flutter_additional_ios_build_settings(target)/flutter_additional_ios_build_settings(target)\n      target.build_configurations.each do |config|\n        config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.5'\n        config.build_settings['EXCLUDED_ARCHS[sdk=iphonesimulator*]'] = 'armv7'\n      end/" Podfile

      - name: Build unsigned iOS app
        # --no-codesign is crucial because we don't have Apple Developer certificates loaded in this runner
        run: flutter build ios --release --no-codesign

      - name: Create IPA for sideloading
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuline_ocr_ios_build
          path: app.ipa
